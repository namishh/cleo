<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cleo</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="chat">
      <aside id="chats-sidebar" class="chats-sidebar">
        <div class="sidebar-head">
          <span>chats</span>
          <button id="close-sidebar-btn" type="button">x</button>
        </div>
        <button id="new-chat-btn" type="button" class="new-chat">+ new chat</button>
        <div id="chat-list" class="chat-list"></div>
      </aside>
      <header class="topbar">
        <button id="sidebar-toggle-btn" type="button">=</button>
        <span class="brand">cleo</span>
      </header>
      <div id="stream" class="stream">
        <div class="empty">send a task to begin</div>
      </div>
      <form id="input-form" class="input-bar">
        <input id="task-input" type="text" placeholder="type a task or question" autocomplete="off" />
        <button id="send-btn" type="submit">send</button>
      </form>
      <div id="status" class="status">idle</div>
    </main>
    <script src="lib/marked.min.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
