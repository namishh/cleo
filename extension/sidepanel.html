<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="container">
      <h1>Redaction Agent</h1>
      <p id="status">Ready</p>
      <div id="progress-container" class="progress-container hidden">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="progress-text" class="progress-text hidden">0%</p>
      <button id="run-btn">Capture & redact active tab</button>
      <p class="hint">Saves a redacted PNG of the current page.</p>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
