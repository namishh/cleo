<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="container">
      <h1>Browser Agent</h1>
      <textarea id="task-input" rows="4" placeholder="Tell the agent what to do..."></textarea>
      <div class="controls">
        <button id="start-btn" class="start">Start</button>
        <button id="stop-btn" class="stop" disabled>Stop</button>
      </div>
      <p id="status">Ready</p>

      <h2>Activity</h2>
      <pre id="activity-log" class="log">(no activity yet)</pre>

      <h2>Accessibility tree</h2>
      <pre id="a11y-tree" class="log">(no tree yet)</pre>

      <h2>Redacted screenshots</h2>
      <div id="screenshots" class="screenshots">(screenshots will appear here)</div>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
